# Pantry 2.0
# Vorher eine .env anlegen (Vorlage .env.example), mindestens AUTH_SECRET und APP_URL setzen.
services:
  pantry:
    image: ghcr.io/netz-sg/pantry:2
    build: .
    container_name: pantry
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET fehlt, siehe .env.example}
      DATABASE_PATH: /app/data/pantry.db
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - pantry-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pantry-data:
